name: Deploy site

# The site is plain static HTML (no build step). This copies the public files
# into _site and publishes them to the gh-pages branch, which GitHub Pages serves.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html stylesheet.css images assets papers.bib .nojekyll _site/
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
